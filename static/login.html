<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title data-i18n="login_title">Log in – Air Quality Dashboard</title>
        <link rel="stylesheet" href="static/styles.css">
        <link rel="icon" href="data:,">
    </head>
    <body class="login-page">
        <main class="login-card">
            <div class="login-header">
                <h1 data-i18n="header_title">Air Quality Dashboard</h1>
                <!-- same language menu as the dashboard -->
                <div class="language-container">
                    <button type="button" id="language-btn" class="language-btn" title="Select Language" aria-label="EN – Select Language" aria-haspopup="true" aria-expanded="false" aria-controls="language-dropdown">
                        <span class="language-active-code">EN</span>
                    </button>
                    <div id="language-dropdown" class="language-dropdown hidden">
                        <button type="button" class="language-option" data-lang="en" lang="en">English</button>
                        <button type="button" class="language-option" data-lang="ro" lang="ro">Română</button>
                        <button type="button" class="language-option" data-lang="fr" lang="fr">Français</button>
                        <button type="button" class="language-option" data-lang="de" lang="de">Deutsch</button>
                    </div>
                </div>
            </div>
            <p id="login-info" class="login-info" role="status"></p>
            <!-- Login -->
            <form id="login-form" class="login-form" hidden>
                <h2 data-i18n="login_heading">Log in</h2>
                <label for="username" data-i18n="username">User name</label>
                <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                <label for="password" data-i18n="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <label class="login-check"><input id="remember" type="checkbox"> <span data-i18n="remember_me">Keep me logged in on this device</span></label>
                <button type="submit" class="login-button" data-i18n="login_button">Log in</button>
            </form>
            <!-- First-run setup of the administrator account -->
            <form id="setup-form" class="login-form" hidden>
                <h2 data-i18n="setup_heading">Create the administrator account</h2>
                <p class="login-hint" data-i18n="setup_hint">Enter the setup code written in the log of the server when it started (e.g. journalctl -u aq_dashboard).</p>
                <label for="setup-code" data-i18n="setup_code">Setup code</label>
                <input id="setup-code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
                <label for="new-username" data-i18n="username">User name</label>
                <input id="new-username" autocomplete="username" autocapitalize="none" spellcheck="false" required pattern="[A-Za-z0-9_.\-]{1,32}">
                <label for="new-password" data-i18n="password">Password</label>
                <input id="new-password" type="password" autocomplete="new-password" required>
                <label for="repeat-password" data-i18n="repeat_password">Repeat the password</label>
                <input id="repeat-password" type="password" autocomplete="new-password" required>
                <button type="submit" class="login-button" data-i18n="setup_button">Create the account</button>
            </form>
            <!-- Change of a default or temporary password after the first login -->
            <form id="change-form" class="login-form" hidden>
                <h2 data-i18n="change_heading">Change your password</h2>
                <p class="login-hint" data-i18n="change_hint">You logged in with a default or temporary password. Choose your own password to continue.</p>
                <input id="change-username" autocomplete="username" hidden>
                <div id="change-current-field" class="login-form-group">
                    <label for="change-current" data-i18n="current_password">Current password</label>
                    <input id="change-current" type="password" autocomplete="current-password">
                </div>
                <label for="change-new" data-i18n="new_password">New password</label>
                <input id="change-new" type="password" autocomplete="new-password" required>
                <label for="change-repeat" data-i18n="repeat_password">Repeat the password</label>
                <input id="change-repeat" type="password" autocomplete="new-password" required>
                <button type="submit" class="login-button" data-i18n="change_password">Change the password</button>
                <button type="button" class="login-link" id="change-cancel" data-i18n="logout">Log out</button>
            </form>
            <p id="login-error" class="login-error" role="alert"></p>
        </main>
        <script src="static/password_strength.js"></script>
        <script src="static/common.js"></script>
        <script src="static/login.js"></script>
    </body>
</html>
